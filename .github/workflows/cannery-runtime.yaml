name: Cannery private runtime
on:
  push:
    paths: ["cannery-runtime/**", "tests/cannery/**", ".github/workflows/cannery-runtime.yaml"]
  pull_request:
    paths: ["cannery-runtime/**", "tests/cannery/**", ".github/workflows/cannery-runtime.yaml"]
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install ./cannery-runtime build ruff
      - run: ruff check cannery-runtime && ruff format --check cannery-runtime
      - run: python -m unittest discover -s tests/cannery -v
      - run: python -m build cannery-runtime
      - run: python -c 'from cannery_kernels import load_cannery_package; assert load_cannery_package'
      - name: Validate workflow expressions
        run: |
          curl -fsSL --retry 3 --max-time 30 -o /tmp/actionlint.tar.gz https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  /tmp/actionlint.tar.gz' | sha256sum -c
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          /tmp/actionlint -shellcheck='' -pyflakes=''
