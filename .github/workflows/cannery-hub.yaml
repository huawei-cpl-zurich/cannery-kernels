name: Cannery Hub client
on:
  push:
    paths: ["kernels/**", "tests/cannery_hub/**", ".github/workflows/cannery-hub.yaml"]
  pull_request:
    paths: ["kernels/**", "tests/cannery_hub/**", ".github/workflows/cannery-hub.yaml"]
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.100.0
      - run: pip install ./kernels ./cannery-runtime pytest 'ruff==0.15.10'
      - run: ruff check kernels/src/kernels/_cannery.py tests/cannery_hub && ruff format --check kernels/src/kernels/_cannery.py tests/cannery_hub
      - run: pytest -q tests/cannery_hub
